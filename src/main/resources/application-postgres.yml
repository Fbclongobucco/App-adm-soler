# Perfil de producao - PostgreSQL
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/adm_soler
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

# Sem default: a aplicacao nao sobe sem JWT_SECRET definido no ambiente.
# O admin inicial vem de application.yml; em producao sobrescreva
# BOOTSTRAP_ADMIN_EMAIL e BOOTSTRAP_ADMIN_PASSWORD.
security:
  jwt:
    secret: ${JWT_SECRET}
