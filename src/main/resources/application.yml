# Configuracoes compartilhadas
spring:
  application:
    name: adm-soler
  profiles:
    active: h2
  jpa:
    open-in-view: false

# Server
server:
  port: 8080

# Seguranca
security:
  jwt:
    issuer: adm-soler
    # Access token curto: ele carrega o perfil, entao uma mudanca de permissao
    # so espera este intervalo para valer.
    access-token-ttl: 15m
    # Refresh token longo, mas revogavel (persistido em hash).
    refresh-token-ttl: 7d
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
  # Admin criado no start, se ainda nao existir um usuario com este email.
  # Vale para todos os perfis e pode ser sobrescrito por variavel de ambiente.
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    name: ${BOOTSTRAP_ADMIN_NAME:Administrador}
    email: ${BOOTSTRAP_ADMIN_EMAIL:email@soler.com.br}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:1234567}
