# Configuracoes compartilhadas
spring:
  application:
    name: adm-soler
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  jpa:
    open-in-view: false
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: 8080

app:
  jwt:
    secret: ${APP_JWT_SECRET:this-is-a-dev-only-secret-key-change-it-before-going-to-production}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  admin:
    name: Administrador
    email: ${APP_ADMIN_EMAIL:admin@soler.com}
    phone: "00000000000"
    password: ${APP_ADMIN_PASSWORD:admin123}
